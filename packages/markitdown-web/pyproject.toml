[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitdown-web"
version = "1.0.0"
description = "Invitation-only document-to-Markdown workspace"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "markitdown[pdf,docx,xlsx]>=0.1.0,<0.2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "markdown-it-py>=3,<5",
  "bleach>=6.2,<7",
  "argon2-cffi>=25,<26",
  "filelock>=3,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "black==23.7.0", "mypy>=1.15,<2", "types-bleach", "xlrd>=2,<3"]

[project.scripts]
markitdown-web = "markitdown_web.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/markitdown_web"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
