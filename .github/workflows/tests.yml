name: tests
on: [pull_request]
permissions:
  contents: read

env:
  # Opt out before Python imports ONNX Runtime, including conversion tests.
  ORT_DISABLE_TELEMETRY: "1"
  # Preserve Unicode in captured CLI output on Windows.
  PYTHONUTF8: "1"
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt
  UV_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt

jobs:
  browser-e2e:
    # Transitional default-policy compatibility target; retires 2027-04-17.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned optional browser harness and official Chromium
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-browser-test.in
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Run fresh-profile synthetic browser flows with Chromium sandbox enabled
        run: .venv/bin/python packages/markitdown-web/tests/browser_e2e.py --out "${{ runner.temp }}/markitdown-browser-evidence"
      - name: Verify product site at desktop and narrow widths on an isolated service
        run: .venv/bin/python scripts/verify-product-site.py --out "${{ runner.temp }}/markitdown-site-evidence"

  production-sandbox:
    # Same mandatory namespaces/profile; no Ubuntu 24.04 policy overrides.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install official launcher build dependencies and pinned web tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential meson ninja-build pkg-config libcap-dev libselinux1-dev
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-web.lock
      - name: Build verified official non-setuid Bubblewrap in runner temp
        run: bash scripts/ci/build-bubblewrap.sh
      - name: Verify production boundary without relaxing host policy
        run: bash scripts/ci/production-sandbox.sh

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned web dependencies and local packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-web.lock
          .venv/bin/python -m pip install --no-deps -e ./packages/markitdown -e ./packages/markitdown-web
      - name: Run web release checks
        run: bash scripts/check-web.sh

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-11-vs2026-arm
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install media tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl ffmpeg
          exiftool -ver
          ffmpeg -version
          ffprobe -version

      - name: Install Hatch
        run: pipx install hatch
      - name: Run tests
        working-directory: packages/markitdown
        run: hatch test --python "${{ matrix.python-version }}"


  ocr-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-11-vs2026-arm
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Install markitdown from the local checkout rather than PyPI, so the
      # plugin is tested against the sibling package it ships alongside.
      - name: Install packages
        run: pip install ./packages/markitdown ./packages/markitdown-ocr pytest

      - name: Run tests
        working-directory: packages/markitdown-ocr
        run: pytest


  mcp-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-11-vs2026-arm
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: pip install "./packages/markitdown[all]" ./packages/markitdown-mcp pytest

      - name: Run tests
        working-directory: packages/markitdown-mcp
        run: pytest
