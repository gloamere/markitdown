name: desktop-build
on:
  push:
    branches: [dev]
    paths: ['packages/markitdown-desktop/**', '.github/workflows/desktop-build.yml']
  pull_request:
    paths: ['packages/markitdown-desktop/**', '.github/workflows/desktop-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            build: build:mac
          - os: windows-latest
            build: build:win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        working-directory: packages/markitdown-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/markitdown-desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:smoke
        env:
          MARKITDOWN_TEST_BACKGROUND: '1'
      - run: npm run ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: MarkItDown-${{ matrix.os }}-unsigned-${{ github.sha }}
          path: |
            packages/markitdown-desktop/dist/*.dmg
            packages/markitdown-desktop/dist/*.zip
            packages/markitdown-desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
