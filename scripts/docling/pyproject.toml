[project]
name = "markitdown-docling-cpu-runtime"
version = "0.1.0"
description = "Isolated, CPU-only Docling PDF preview runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling-slim[convert-core,format-pdf,models-local]==2.133.0",
  "docling-core==2.99.0",
  "docling-ibm-models==4.0.3",
  "docling-parse==7.22.2",
  "transformers==5.18.0",
  "torch==2.14.1+cpu",
  "torchvision==0.29.1+cpu",
  "opencv-python-headless==4.14.0.94",
  "reportlab==4.5.1",
  "bleach==6.4.0",
  "markdown-it-py==4.2.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
